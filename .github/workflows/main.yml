name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NINJA_VERSION: "1.11.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.preset }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: win-amd64-relwithdebinfo-lean
            sdk_type: RelWithDebInfo
                
    steps:
      
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---- caches ----------------------------------------------------------
      # RIGHT — `-` indented 2 spaces deeper than `restore-keys:`
          with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
                 ccache-${{ runner.os }}-
                      
      - name: Cache CMake FetchContent (FidelityFX, etc.)
        uses: actions/cache@v4
        with:
          path: |
            out/sdk/_deps
            out/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'thirdparty/rexglue-sdk/CMakeLists.txt') }}
          restore-keys:  |
            - fetchcontent-${{ runner.os }}-
      - name: Debug dump path
        shell: pwsh
        run: |
            Write-Host "cwd: $(Get-Location)"
            Get-ChildItem -Recurse -Filter "*.xex" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
            Get-ChildItem assets -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
            # in the workflow, right after checkout, before caches
            if (Test-Path "~\.ccache\assets\game\doa4.xex") {
            New-Item -ItemType Directory -Force assets\game | Out-Null
            Move-Item "~\.ccache\assets\game\doa4.xex" assets\game\doa4.xex -Force
              }
            Remove-Item -Recurse -Force "~" -ErrorAction SilentlyContinue
        

      # ---- toolchain -------------------------------------------------------
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          version: ${{ env.NINJA_VERSION }}

      - name: Verify LLVM/Clang
        shell: pwsh
        run: |
          clang --version
          clang++ --version

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---- inputs ----------------------------------------------------------
      - name: Verify game dump
        shell: pwsh
        run: |
          if (-not (Test-Path "assets\game\doa4.xex")) {
            Write-Error "assets\game\doa4.xex not found."
            exit 1
          }
          Get-Item "assets\game\doa4.xex" | Format-List Name, Length

      # ---- rust tools ------------------------------------------------------
   

      # ---- SDK / codegen ---------------------------------------------------
      - name: Configure SDK
        shell: pwsh
        run: |
          cmake -S thirdparty\rexglue-sdk -B out\sdk -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.sdk_type }} `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DREXGLUE_BUILD_TESTS=OFF `
            "-DCMAKE_C_FLAGS=-march=x86-64-v3" `
            "-DCMAKE_CXX_FLAGS=-march=x86-64-v3"

      - name: Build SDK (rexglue target)
        run: cmake --build out\sdk --target rexglue

      - name: Run codegen
        shell: pwsh
        run: |
          $exe = ".\out\sdk\rexgluerd.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem -Recurse -Filter rexgluerd.exe -ErrorAction SilentlyContinue |
                    Select-Object -First 1).FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) {
            Write-Error "rexgluerd.exe not found anywhere"
            exit 1
          }
          Write-Host "Using $exe"
          & $exe codegen ".\doa4retail_manifest.toml"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "codegen failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      # ---- game ------------------------------------------------------------
      - name: Configure game
        run: cmake --preset ${{ matrix.preset }}

      - name: Build game
        run: cmake --build --preset ${{ matrix.preset }}

      # ---- package + upload ------------------------------------------------
      - name: Package release zip
        shell: pwsh
        run: powershell -File tools\package_release.ps1 -SdkBin out\sdk\sdk-bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.preset }}
          path: |
            publish/*.zip
            publish/**/*.exe
          if-no-files-found: warn
          retention-days: 7
