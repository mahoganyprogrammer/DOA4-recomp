name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CMAKE_VERSION: "3.27.x"
  NINJA_VERSION: "1.11.1"

jobs:
  build:
    name: Build (${{ matrix.preset }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: win-amd64-relwithdebinfo-lean
            sdk_type: RelWithDebInfo

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---- Toolchain -------------------------------------------------------
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          version: ${{ env.NINJA_VERSION }}

      - name: Install LLVM/Clang
        shell: pwsh
        run: |
          # The build expects clang/clang++ on PATH targeting MSVC.
          # windows-2022 images ship LLVM already; verify it's there.
          clang --version
          clang++ --version

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---- Cache -----------------------------------------------------------
      - name: Cache CMake FetchContent (FidelityFX, etc.)
        uses: actions/cache@v4
        with:
          path: |
            out/sdk/_deps
            out/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/compiler
            rust/launcher

      # ---- Rust tools (launcher + compiler, no game data needed) -----------
      - name: Test Rust tools
        run: |
          cargo test --manifest-path rust\compiler\Cargo.toml
          cargo test --manifest-path rust\launcher\Cargo.toml

      - name: Build Rust tools (release)
        run: |
          cargo build --release --manifest-path rust\compiler\Cargo.toml
          cargo build --release --manifest-path rust\launcher\Cargo.toml

      # ---- Codegen ---------------------------------------------------------
      # NOTE: codegen requires a user-supplied dump (assets\game\doa4.xex).
      # CI cannot legally/automatically obtain this. To build the *game*
      # in CI you must provide the dump as an encrypted secret/artifact and
      # stage it below; otherwise only the SDK + Rust tools are buildable.
      - name: Stage game dump (optional, from secret)
        if: ${{ secrets.DOA4_XEX_BASE64 != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets\game | Out-Null
          [IO.File]::WriteAllBytes(
            "$PWD\assets\game\doa4.xex",
            [Convert]::FromBase64String("${{ secrets.DOA4_XEX_BASE64 }}")
          )

      # ---- Build SDK codegen tool -----------------------------------------
      - name: Configure SDK
        run: |
          cmake -S thirdparty\rexglue-sdk -B out\sdk -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.sdk_type }} `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DREXGLUE_BUILD_TESTS=OFF `
            "-DCMAKE_C_FLAGS=-march=x86-64-v3" `
            "-DCMAKE_CXX_FLAGS=-march=x86-64-v3"

      - name: Build SDK (rexglue target)
        run: cmake --build out\sdk --target rexglue

      # ---- Run codegen (only if dump staged) ------------------------------
      - name: Run codegen
        if: ${{ secrets.DOA4_XEX_BASE64 != '' }}
        run: out\sdk\rexgluerd.exe codegen .\doa4retail_manifest.toml

      # ---- Build the game --------------------------------------------------
      # Skipped when no dump is present; remove the `if` once you supply one.
      - name: Configure game
        if: ${{ secrets.DOA4_XEX_BASE64 != '' }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build game
        if: ${{ secrets.DOA4_XEX_BASE64 != '' }}
        run: cmake --build --preset ${{ matrix.preset }}

      # ---- Package ---------------------------------------------------------
      - name: Package release zip
        if: ${{ secrets.DOA4_XEX_BASE64 != '' }}
        shell: pwsh
        run: |
          powershell -File tools\package_release.ps1 -SdkBin out\sdk\sdk-bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.preset }}
          path: |
            out/**.exe
            out/**.zip
            rust/compiler/target/release/*.exe
            rust/launcher/target/release/*.exe
          if-no-files-found: warn
          retention-days: 14
